name: Release

# Pushing a tag vX.Y.Z (matching Version: in the spec) builds the packages
# and the kpxc-secret-service-release package (repository configuration and
# signing key), signs them into a dnf repository, publishes that repository
# on GitHub Pages and creates a GitHub release with the packages attached.
#
# Each job gets only what it needs: the build runs without secrets, signing
# runs in a fresh container with the key from the `release` environment and
# refuses any key but the committed RPM-GPG-KEY-kpxc-secret-service, and only
# the job that creates the release can write to the repository.
#
# One-time setup, see README.md ("Releases"):
#   - environment `release`, limited to tags matching v*, with the secrets
#     GPG_PRIVATE_KEY (ASCII-armored) and, if the key has one, GPG_PASSPHRASE
#   - Settings → Pages → Source: GitHub Actions
#   - Settings → Environments → github-pages: allow tags matching v*

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44
      # mock mounts /proc, /sys and /dev into its chroot.
      options: --privileged
    steps:
      # Before checkout, which otherwise falls back to a download without .git.
      - name: Install git
        run: dnf install -y git-core

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rpmautospec derives Release and %changelog from the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against the spec
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' kpxc-secret-service.spec)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Version: $version in kpxc-secret-service.spec"
              exit 1
          fi

      - uses: ./.github/actions/mock-build
        with:
          chroot: fedora-44-x86_64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: results/fedora-44-x86_64/*.rpm
          if-no-files-found: error

  sign:
    name: Sign
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44
    # Holds the signing key.
    environment: release
    outputs:
      fingerprint: ${{ steps.sign.outputs.fingerprint }}
    steps:
      # tar for upload-pages-artifact.
      - name: Install tools
        run: dnf install -y make tar rpm-build createrepo_c rpm-sign gnupg2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: results/fedora-44-x86_64

      - name: Create the signed dnf repository
        id: sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
              echo "::error::Add the GPG_PRIVATE_KEY secret to the release environment (see README.md)"
              exit 1
          fi
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          # Users verify the key against the committed one, so never sign
          # with another (e.g. a replaced secret).
          committed=$(gpg --show-keys --with-colons RPM-GPG-KEY-kpxc-secret-service | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != "$committed" ]; then
              echo "::error::GPG_PRIVATE_KEY is $fingerprint, but RPM-GPG-KEY-kpxc-secret-service is $committed"
              exit 1
          fi
          passphrase_file=
          if [ -n "$GPG_PASSPHRASE" ]; then
              passphrase_file=$GNUPGHOME/passphrase
              printf '%s' "$GPG_PASSPHRASE" > "$passphrase_file"
          fi
          owner=${GITHUB_REPOSITORY_OWNER,,}
          make release-rpm repo MOCK_CHROOT=fedora-44-x86_64 GPG_KEY="$fingerprint" \
              GPG_PASSPHRASE_FILE="$passphrase_file" \
              REPO_URL="https://$owner.github.io/${GITHUB_REPOSITORY#*/}"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/repo

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            build/repo/
            results/fedora-44-x86_64/*.src.rpm
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ needs.sign.outputs.fingerprint }}
        run: |
          # Under a fixed name, so that .../releases/latest/download/
          # kpxc-secret-service-release.noarch.rpm always finds it.
          cp build/repo/kpxc-secret-service-release-*.noarch.rpm build/kpxc-secret-service-release.noarch.rpm
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "Packages and repository metadata are signed with the OpenPGP key \`$FINGERPRINT\`." \
              build/kpxc-secret-service-release.noarch.rpm \
              build/repo/kpxc-secret-service-[0-9]*.noarch.rpm \
              results/fedora-44-x86_64/kpxc-secret-service-*.src.rpm \
              build/repo/RPM-GPG-KEY-kpxc-secret-service build/repo/kpxc-secret-service.repo

  pages:
    name: Publish the dnf repository
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
