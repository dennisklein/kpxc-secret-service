name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: Fedora 44 x86_64 RPM and SRPM
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44
      # mock mounts /proc, /sys and /dev into its chroot.
      options: --privileged
    steps:
      # Before checkout, which otherwise falls back to a download without .git.
      - name: Install git
        run: dnf install -y git-core

      - uses: actions/checkout@v7
        with:
          # rpmautospec derives Release and %changelog from the full history.
          fetch-depth: 0

      - uses: ./.github/actions/mock-build
        with:
          chroot: fedora-44-x86_64

      # The release path with a throwaway key: release package and signed
      # repository, then installing from it the way users do.
      - name: Test the signed repository
        run: |
          dnf install -y rpm-build createrepo_c rpm-sign gnupg2
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --passphrase '' --quick-gen-key 'kpxc-secret-service CI <ci@example.invalid>' default sign 1d
          make release-rpm repo MOCK_CHROOT=fedora-44-x86_64 GPG_KEY=ci@example.invalid \
              REPO_URL="file://$PWD/build/repo"
          dnf install -y build/repo/kpxc-secret-service-release-*.noarch.rpm
          dnf install -y kpxc-secret-service
          rpm -qi kpxc-secret-service kpxc-secret-service-release | grep -E '^(Name|Version|Release|Signature)'
          kpxc-secret-service --help > /dev/null

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fedora-44-x86_64
          path: |
            results/fedora-44-x86_64/*.rpm
            results/fedora-44-x86_64/*.log
