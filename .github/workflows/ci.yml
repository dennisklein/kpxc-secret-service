name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: Fedora 44 x86_64 RPM and SRPM
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44
      # mock mounts /proc, /sys and /dev into its chroot.
      options: --privileged
    steps:
      # Before checkout, which otherwise falls back to a download without .git.
      - name: Install git
        run: dnf install -y git-core

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rpmautospec derives Release and %changelog from the full history.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/mock-build
        with:
          chroot: fedora-44-x86_64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fedora-44-x86_64
          path: |
            results/fedora-44-x86_64/*.rpm
            results/fedora-44-x86_64/*.log

  repo:
    name: Signed repository
    needs: rpm
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf install -y make rpm-build createrepo_c rpm-sign gnupg2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora-44-x86_64
          path: results/fedora-44-x86_64

      # The release workflow's signing job with a throwaway key: release
      # package and signed repository, then installing from it the way users do.
      - name: Test the signed repository
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --passphrase '' --quick-gen-key 'kpxc-secret-service CI <ci@example.invalid>' default sign 1d
          make release-rpm repo MOCK_CHROOT=fedora-44-x86_64 GPG_KEY=ci@example.invalid \
              REPO_URL="file://$PWD/build/repo"
          dnf install -y build/repo/kpxc-secret-service-release-*.noarch.rpm
          dnf install -y kpxc-secret-service
          # Fails unless every package carries a valid signature by the imported key.
          rpmkeys --checksig build/repo/*.rpm results/fedora-44-x86_64/*.src.rpm
          kpxc-secret-service --help > /dev/null
