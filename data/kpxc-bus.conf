<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private session-type bus for kpxc-secret-service, run by dbus-broker-launch
     from kpxc-bus.service. The listening socket ($XDG_RUNTIME_DIR/kpxc-bus)
     comes from kpxc-bus.socket, and only the owning user may connect. -->
<busconfig>
  <type>session</type>

  <!-- Unlike the desktop session bus, only org.freedesktop.secrets is
       activatable here (through kpxc-secret-service.service), so GNOME
       Keyring and other session services never get started on this bus. -->
  <servicedir>/usr/share/kpxc-secret-service/dbus-1/services</servicedir>

  <!-- Like session.conf, minus its eavesdrop="true" (which dbus-broker
       ignores). Without the receive rule, dbus-broker drops all signals. -->
  <policy context="default">
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
</busconfig>
